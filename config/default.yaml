project:
  name: "Video2World-Lite"
  description: "Monocular video to robot-centric 3D world model"

input:
  video_path: "data/raw/input_video.mp4"
  frame_dir: "data/frames"

preprocessing:
  frame_rate: 2
  max_frames: 60
  resize_width: 1024
  blur_threshold: 10.0

colmap:
  workspace: "outputs/colmap"
  matcher: "sequential"
  camera_model: "SIMPLE_PINHOLE"
  data_type: "VIDEO"
  quality: "MEDIUM"

depth:
  model: "depth-anything-v2-small"
  mode: "depth-anything-v2"
  repo_path: "third_party/Depth-Anything-V2"
  encoder: "vits"
  checkpoint: "third_party/Depth-Anything-V2/checkpoints/depth_anything_v2_vits.pth"
  device: "mps"
  input_size: 518
  save_numpy: true
  save_visualization: true
  heuristic_min_depth: 0.5
  heuristic_max_depth: 4.0

scale_alignment:
  enabled: true
  scope: "global"
  method: "robust_linear_fit"
  min_sparse_points_per_frame: 3
  trim_quantile: 0.1
  prediction_transform: "auto"
  invert_prediction: false

fusion:
  pixel_stride: 6
  min_depth: 0.2
  max_depth: 250.0
  voxel_size: 0.03
  max_points_per_frame: 80000

cleaning:
  robust_crop: true
  robust_crop_mad_scale: 12.0
  robust_crop_min_keep_ratio: 0.25
  adaptive_voxel_min_scene_ratio: 0.00001
  remove_outliers: true
  statistical_nb_neighbors: 20
  statistical_std_ratio: 2.0
  radius_outlier_removal: false
  radius: 0.08
  radius_nb_points: 12

world_model:
  estimate_support_plane: true
  estimate_obstacles: true
  save_json: true

visualization:
  save_camera_trajectory: true
  save_scene_preview: true
  save_demo_video: false

presentation:
  enabled: true
  lower_quantile: 0.03
  upper_quantile: 0.97
  margin_ratio: 0.20
  min_margin: 1.0
  render_width: 1400
  render_height: 1000
  render_max_points: 220000
  render_point_radius: 2
  depth_grid_columns: 4
  depth_grid_max_items: 8

mesh:
  enabled: false
  max_points: 60000
  poisson_depth: 7
  density_quantile: 0.02
